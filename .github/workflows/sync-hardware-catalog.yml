name: Sync Hardware Reference Catalog

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hardware-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync open-source hardware datasets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-hardware-catalog.mjs

      - name: Commit and push updated catalog if changed
        run: |
          if git diff --quiet public/catalog && [ -z "$(git ls-files --others --exclude-standard public/catalog)" ]; then
            echo "No catalog changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog
          git commit -m "chore(catalog): sync open-source hardware reference datasets"
          git push origin main
